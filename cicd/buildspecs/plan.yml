version: 0.2

phases:
  install:
    commands:
      - curl -fsSL https://astral.sh/uv/0.10.2/install.sh | sh
      - curl -fsSLo /tmp/terraform_1.14.5_linux_amd64.zip https://releases.hashicorp.com/terraform/1.14.5/terraform_1.14.5_linux_amd64.zip
      - curl -fsSLo /tmp/terraform_SHA256SUMS https://releases.hashicorp.com/terraform/1.14.5/terraform_1.14.5_SHA256SUMS
      - cd /tmp && grep 'terraform_1.14.5_linux_amd64.zip$' terraform_SHA256SUMS | sha256sum -c -
      - unzip -oq /tmp/terraform_1.14.5_linux_amd64.zip -d /tmp/terraform
      - export PATH="/tmp/terraform:$HOME/.local/bin:$PATH"
  pre_build:
    commands:
      - cd "$CODEBUILD_SRC_DIR"
      - export PATH="/tmp/terraform:$HOME/.local/bin:$PATH"
      - export AWS_DEFAULT_REGION=us-east-2
      - test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
      - uv sync --locked
      - uv run --locked ruff format --check .
      - uv run --locked ruff check .
      - uv run --locked pytest -q
      - terraform fmt -check -recursive
      - terraform init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET"
      - terraform validate -no-color > /tmp/terraform-validate.stdout 2> /tmp/terraform-validate.stderr; validate_status=$?; cat /tmp/terraform-validate.stdout; cat /tmp/terraform-validate.stderr >&2; echo "terraform validate exit code: $validate_status"; exit "$validate_status"
  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR"
      - uv run --locked python build.py
      - terraform plan -input=false -no-color -lock-timeout=2m -out=release.tfplan
      - terraform show -json release.tfplan | python scripts/check_release_plan.py
      - mkdir -p release-bundle
      - cp -a main.py triage.py smoke.py pyproject.toml uv.lock build.py main.tf backend.tf observability.tf .terraform.lock.hcl .terraform-version .python-version release.tfplan release-bundle/
      - mkdir -p release-bundle/cicd/buildspecs release-bundle/scripts release-bundle/dist
      - cp cicd/buildspecs/apply.yml release-bundle/cicd/buildspecs/apply.yml
      - cp scripts/check_release_plan.py release-bundle/scripts/check_release_plan.py
      - cp dist/agent.zip release-bundle/dist/agent.zip

artifacts:
  base-directory: release-bundle
  files:
    - "**/*"
